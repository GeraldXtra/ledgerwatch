<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values on an iPhone. The status bar below is translucent, so in the
         installed app the page is drawn UNDER the clock and status icons; the
         sticky bars pad themselves by the top inset (see .lw-chrome), and the
         fixed toasts and action bar clear the home indicator by the bottom one.
         Without this line every inset is zero and the masthead sat behind the
         status bar on every iPhone that had added the app to the home screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16283f" />
    <!--
      CONTENT SECURITY POLICY. This page decrypts private keys, so an injected
      script is a fund loss, not an information leak. The policy names every
      origin this application legitimately talks to and nothing else:

        script   this origin, and Cloudflare's Turnstile widget. No inline
                 script at all, which is why the theme bootstrap is a file.
        connect  this origin and the API. Every chain and Bitcoin call goes
                 through the API's proxy, so no RPC host is listed and a script
                 that somehow ran here still could not send a key anywhere.
        img      this origin, data: for QR codes and avatars, and CoinGecko's
                 image hosts for coin logos.
        style    this origin, inline (React sets style attributes), Google Fonts.
        frame    Turnstile renders its challenge in an iframe.

      %VITE_API_URL% is replaced by Vite at build time from the environment, so
      each deployment names its own API host. frame-ancestors cannot be set from
      a meta tag; vercel.json sends it as a header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; connect-src 'self' %VITE_API_URL% http://localhost:8000 ws://localhost:5173 http://localhost:5173; img-src 'self' data: blob: https://coin-images.coingecko.com https://assets.coingecko.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'"
    />
    <!-- Theme before first paint. A file, not inline, so the policy above can
         forbid inline script entirely. -->
    <script src="/theme-boot.js"></script>
    <meta
      name="description"
      content="LedgerWatch chases the money you are owed and watches the markets you cannot, so nothing slips while you run your business."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LedgerWatch" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <title>LedgerWatch: Automated receivables and market monitoring</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
