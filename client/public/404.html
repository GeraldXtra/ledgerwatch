<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · LedgerWatch</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --page: #f2f3f3;
        --panel: #ffffff;
        --ink: #16191f;
        --muted: #5f6b7a;
        --line: #e9ebed;
        --accent: #ff9900;
        --on-accent: #16191f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #121417;
          --panel: #1b1e23;
          --ink: #eef0f2;
          --muted: #a4acb6;
          --line: #2f343b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--page);
        color: var(--ink);
        font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      main {
        width: 100%;
        max-width: 520px;
        padding: 32px 28px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
      }
      .brand {
        font-size: 18px;
        font-weight: 700;
        color: var(--ink);
        text-decoration: none;
      }
      .brand em {
        font-style: normal;
        color: var(--accent);
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 26px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.6;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      nav a {
        padding: 9px 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
      }
      nav a.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--on-accent);
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">Ledger<em>Watch</em></a>
      <h1>There is no page at this address</h1>
      <p>The link may be mistyped, or the page may have moved. These are the places most people are looking for.</p>
      <nav aria-label="Places to go">
        <a class="primary" href="/">Go to the front page</a>
        <a href="/docs">Read the guide</a>
        <a href="/contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
