# gitleaks configuration for LedgerWatch.
#
# WHY THIS FILE IS TUNED RATHER THAN LEFT AT THE DEFAULTS
#
# This repository leaked three BIP-39 mnemonics and their private keys once
# already (LW-001, docs/SECURITY.md section 6). The default rule set does not
# look for a mnemonic at all — it looks for API keys — so the incident that
# actually happened here would have passed a stock scan. The two custom rules
# below are the ones that matter for this project.
#
# It is also tuned the other way: this codebase deliberately carries real, public
# blockchain addresses and contract addresses in config/chains.js, and Cloudflare's
# published always-pass test keys in the env examples. Those must not fail the
# build, or the scan gets switched off within a week and protects nothing.

title = "LedgerWatch"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# The two rules written for this project's own incident
# ---------------------------------------------------------------------------

[[rules]]
id = "bip39-mnemonic"
description = "A BIP-39 recovery phrase (12 or 24 lowercase words in a row)"
# Twelve or more lowercase words separated by single spaces, on one line. Real
# prose in this repository is punctuated and capitalised, so it does not match;
# a seed phrase is exactly this shape and nothing else is.
regex = '''(?i)\b(?:[a-z]{3,8}[ ]){11,23}[a-z]{3,8}\b'''
tags = ["wallet", "seed", "critical"]
[rules.allowlist]
# The words below appear in documentation ABOUT seed phrases. A phrase that is
# genuinely secret never sits next to the word "example".
regexes = ['''(?i)(example|placeholder|abandon abandon|zoo zoo|test vector)''']
paths = [
  '''docs/''',
  '''client/src/docs/''',
  '''(^|/)[C]LAUDE\.md$''',
  '''(^|/)README\.md$''',
]

[[rules]]
id = "evm-private-key"
description = "A raw secp256k1 private key (32 bytes of hex)"
# Anchored on a 64-hex run that is NOT a transaction hash or a block hash. Those
# appear in this codebase as `txHash` values and in test fixtures, so the rule
# requires the key-ish framing rather than the bare hex.
regex = '''(?i)(private[_-]?key|privkey|secret[_-]?key)["'\s:=]{1,10}(0x)?[a-f0-9]{64}\b'''
tags = ["wallet", "key", "critical"]

# ---------------------------------------------------------------------------
# What is deliberately NOT a finding
# ---------------------------------------------------------------------------

[allowlist]
description = "Public-by-construction values this product cannot function without"

paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)client/public/docs/''',
  '''(^|/)dist/''',
  '''(^|/)node_modules/''',
]

regexes = [
  # Cloudflare's published always-pass test keys. Documented as such in
  # server/.env.example and client/.env.example, and safe by design (LW-050,
  # LW-070). A REAL Turnstile secret does not look like this.
  '''1x0{20,}A{0,2}''',
  '''1x00000000000000000000AA''',
  # Public EVM addresses. config/chains.js is a register of contract addresses
  # and every one of them is meant to be readable — that is the whole point of
  # having a single verified source (ARCHITECTURE.md invariant 1).
  '''0x[a-fA-F0-9]{40}\b''',
  # keccak256("Transfer(address,address,uint256)") and the ERC-20 function
  # selectors beside it. Public constants, not secrets.
  '''0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef''',
]

# The demo account's password is published in the README on purpose, and the
# seed script is gated to that one address. Flagging it trains people to ignore
# the scanner. Noted here rather than silently allowed, so the decision is visible.
stopwords = [
  "demo@ledgerwatch.app",
]
