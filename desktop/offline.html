<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LedgerWatch</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Open Sans", "Segoe UI", system-ui, sans-serif; background: #f7f7f7; color: #16191f; }
      @media (prefers-color-scheme: dark) { body { background: #16191f; color: #f2f3f3; } }
      main { max-width: 440px; padding: 24px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 16px; line-height: 1.5; }
      button { font: inherit; padding: 10px 18px; border-radius: 999px; border: 0; background: #ff9900; color: #16191f; font-weight: 600; cursor: pointer; }
      code { font-size: 13px; opacity: 0.8; }
    </style>
  </head>
  <body>
    <main>
      <h1>LedgerWatch could not be reached</h1>
      <p>Check that this computer is online, then try again.</p>
      <p><code id="reason"></code></p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById("reason").textContent = params.get("reason") || "";
      document.getElementById("retry").addEventListener("click", () => {
        location.href = params.get("url") || "https://www.useledgerwatch.co/app";
      });
    </script>
  </body>
</html>
